[package]
name        = "mythwright"
version     = "1.0.0"
description = "Mythwright — Forge your narrative"
authors     = ["Absurd Literary Softwares"]
license     = "MIT"
repository  = "https://github.com/rokos-absurd-basilisk/Mythwright"
edition     = "2021"
rust-version = "1.77"

[lib]
name       = "mythwright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[profile.release]
panic     = "abort"    # smaller binary
codegen-units = 1      # better optimisation
lto       = true       # link-time optimisation
strip     = true       # strip debug symbols

[features]
default         = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
